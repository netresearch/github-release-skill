version: 1
skill_id: github-release

preconditions:
  - type: file_exists
    target: ".git"

mechanical:
  # Release workflow checks
  - id: GR-1
    type: file_exists
    target: ".github/workflows/release.yml"
    severity: error
    desc: "Release workflow must exist"

  - id: GR-2
    type: contains
    target: ".github/workflows/release.yml"
    pattern: "tags:"
    severity: error
    desc: "Release workflow must trigger on version tags"

  - id: GR-3
    type: contains
    target: ".github/workflows/release.yml"
    pattern: "id-token: write"
    severity: error
    desc: "Release workflow must have id-token write permission for signing"

  - id: GR-4
    type: contains
    target: ".github/workflows/release.yml"
    pattern: "attestations: write"
    severity: error
    desc: "Release workflow must have attestations write permission"

  - id: GR-5
    type: contains
    target: ".github/workflows/release.yml"
    pattern: "workflow_dispatch"
    severity: info
    desc: >-
      Release workflow may have workflow_dispatch for manual triggers (info
      only — netresearch skill-repo release workflow is intentionally
      tag-push-only because workflow_dispatch + auto-bump produced unsigned
      tags. Inline workflows that build on it can opt-in safely).

  # Tag integrity checks
  - id: GR-6
    type: command
    pattern: "! git for-each-ref 'refs/tags/v*' --format='%(objecttype)' | grep -qvx tag"
    severity: error
    desc: >-
      All version tags must be annotated (not lightweight). `for-each-ref`
      prints one object type per `v*` tag: `tag` for an annotated tag, `commit`
      for a lightweight one. `grep -qvx tag` succeeds as soon as one line is
      not exactly `tag`, and the leading `!` inverts that — so the check exits
      0 only when every version tag is annotated, or no version tag exists yet.
      Spelled without command substitution because the runner's allowlist
      refuses `$(...)` in a single-line pattern and would block the check.

  # Version sync checks
  - id: GR-7
    type: command
    pattern: "vendor/bin/validate-pre-release.sh --version-sync-only 2>/dev/null"
    severity: warning
    desc: >-
      Version files must be in sync. Requires the github-release skill's
      validate-pre-release.sh to be installed at vendor/bin/ (the runner's
      command whitelist disallows ${CLAUDE_PLUGIN_ROOT} paths).

  # CHANGELOG checks
  - id: GR-8
    type: contains
    target: "CHANGELOG.md"
    pattern: "[Unreleased]"
    severity: warning
    desc: "CHANGELOG.md must have an Unreleased section"

  # Supply chain security checks
  - id: GR-9
    type: script
    severity: warning
    desc: >-
      Latest published release should carry an SBOM asset. The asset list comes
      from `gh api` on `releases/latest`: the runner's allowlist permits only
      read-only `gh api`, and refuses `gh release view` outright. When that API
      call fails — no release published yet, `gh` missing or unauthenticated,
      origin not on GitHub — the body exits 0. A script body cannot tell those
      cases apart and has no way to report `skip`, so failing would invent a
      finding where there is no evidence in either direction.
    command: |
      assets=$(gh api 'repos/{owner}/{repo}/releases/latest' --jq '.assets[].name' 2>/dev/null) || exit 0
      printf '%s\n' "$assets" | grep -qi sbom

  - id: GR-10
    type: script
    severity: warning
    desc: >-
      Latest published release should carry cosign signature artefacts.
      Accepted (in priority order): `.sigstore.json` (preferred — on the
      OSSF Scorecard Signed-Releases allowlist, and what the
      netresearch/skill-repo-skill release workflow emits via
      `cosign sign-blob --bundle`), `.sigstore` (also on the Scorecard
      allowlist), `.bundle` (legacy cosign default — bytes are identical to
      `.sigstore.json`, only the filename differs), or a detached `.sig` plus
      the `.pem` certificate for the same artefact (cosign's two-file
      `--output-signature`/`--output-certificate` form). That pair is matched
      on basename: `X.sig` counts only when `X.pem` is present too, so an
      unrelated `app.sig` alongside `other.pem` fails — neither artefact is
      verifiable. A lone `.sig` or lone `.pem` fails likewise.
      `gh release view` is not available to a checkpoint — the allowlist permits
      read-only `gh api` only — so the asset list is read from `releases/latest`.
      A failing API call exits 0, for the reason spelled out on GR-9.
    command: |
      names=$(gh api 'repos/{owner}/{repo}/releases/latest' --jq '.assets[].name' 2>/dev/null) || exit 0
      printf '%s\n' "$names" | grep -qE '\.(sigstore\.json|sigstore|bundle)$' && exit 0
      while IFS= read -r asset; do
        case "$asset" in
          *.sig) printf '%s\n' "$names" | grep -qxF "${asset%.sig}.pem" && exit 0 ;;
        esac
      done <<<"$names"
      exit 1

  - id: GR-11
    type: command
    pattern: "git config user.signingkey >/dev/null 2>&1"
    severity: info
    desc: "Git signing is configured (signing key set)"

  # Release pipeline integrity checks
  - id: GR-12
    type: command
    pattern: "vendor/bin/validate-reusable-workflows.sh"
    severity: error
    desc: >-
      Reusable-workflow reference in `.github/workflows/release*.yml` files
      points to a path that no longer exists at the pinned SHA. Release
      workflow will fail on tag push. Update the ref or remove the job.
      Requires the validator at vendor/bin/.

  - id: GR-13
    type: command
    pattern: "vendor/bin/check-changelog-links.py"
    severity: warning
    desc: >-
      CHANGELOG.md reference-style header [X.Y.Z] missing matching
      [X.Y.Z]: <URL> footer link. Add the link entry and update the
      [Unreleased]: compare/vX.Y.Z...HEAD range to the new version.

  # Release-notes credit format (release-process.md, "Crediting contributors")
  - id: GR-14
    type: script
    severity: error
    desc: >-
      The latest release body must not hand-write a Contributors/Credits
      section. GitHub draws that avatar row itself from the @mentions in the
      body, so a written section duplicates the row and loses who did what.
      The body is read with `gh api` — the allowlist refuses `gh release view`.
      No release yet, or an unreachable API, exits 0 (see GR-9).
    command: |
      body=$(gh api 'repos/{owner}/{repo}/releases/latest' --jq '.body // ""' 2>/dev/null) || exit 0
      printf '%s\n' "$body" | grep -qE '^## (Contributors|Credits)' && exit 1
      exit 0

  - id: GR-15
    type: script
    severity: error
    desc: >-
      Mentions in a release body must be bare `@user`, never
      `[@user](url)`. A markdown link renders as a plain hyperlink, leaves
      mentions_count null and suppresses the Contributors row entirely — the
      one place where the house rule "always link references" is wrong.
      The body is read with `gh api` — the allowlist refuses `gh release view`.
      No release yet, or an unreachable API, exits 0 (see GR-9).
    command: |
      body=$(gh api 'repos/{owner}/{repo}/releases/latest' --jq '.body // ""' 2>/dev/null) || exit 0
      printf '%s\n' "$body" | grep -qE '\[@[A-Za-z0-9_-]+\]\(' && exit 1
      exit 0

  - id: GR-16
    type: script
    severity: warning
    desc: >-
      The latest release should mention at least one contributor, which is
      what makes GitHub render the Contributors row. A 0 usually means the
      mentions were written as markdown links (see GR-15) rather than that
      nobody contributed. The comparison lives in a script body because the
      allowlist refuses the `test "$(...)"` spelling this check needs.
      No release yet, or an unreachable API, exits 0 (see GR-9).
    command: |
      mentions=$(gh api 'repos/{owner}/{repo}/releases/latest' --jq '.mentions_count // 0' 2>/dev/null) || exit 0
      test "${mentions:-0}" -ge 1

llm_reviews:
  - id: GR-R1
    domain: release-safety
    severity: error
    desc: "No dangerous release commands used in conversation"
    prompt: |
      Check the conversation for any of these dangerous commands that were EXECUTED (not just discussed):
      - gh release create (creates lightweight tags, bypasses CI)
      - gh release delete (doesn't fix immutable tag burning)
      - gh release edit (immutable releases can't be edited)
      - git tag without -s or -a flag for version tags
      - git push --delete for tags
      - git push origin :refs/tags/
      If any were executed, report as FAIL with the specific command.

  - id: GR-R2
    domain: release-process
    severity: warning
    desc: "Release follows correct process"
    prompt: |
      If a release was performed in this conversation, verify it followed the correct process:
      1. Version files were updated via a PR (not direct push to main)
      2. Signed annotated tag was created with git tag -s (not git tag without -s)
      3. gh release create was NOT used
      4. The CI release workflow was relied upon for creating the GitHub release
      If the process was not followed, explain what went wrong.

  - id: GR-R3
    domain: ecosystem-detection
    severity: warning
    desc: "All version files were updated during release"
    prompt: |
      If version files were updated during a release, check that ALL relevant files were found and updated:
      - TYPO3: ext_emconf.php AND composer.json (if version field exists) AND Documentation/guides.xml
      - Skill repos: plugin.json AND SKILL.md metadata.version
      - Node.js: package.json AND package-lock.json
      - CHANGELOG.md [Unreleased] section was promoted
      Report any files that were missed.

  - id: GR-R4
    domain: release-notes
    severity: warning
    desc: "Published release description was overhauled into a narrative"
    prompt: |
      If a GitHub Release was published in this conversation, verify its description was
      overhauled from the auto-generated commit/PR dump into a user-facing narrative summary
      (SKILL.md step 9 "Overhaul release description"; references/release-process.md
      "Narrative over implementation details").
      The published description must lead with the user-facing story and brief feature sections,
      NOT a raw "## Changes" list of feat:/fix:/chore(deps): commit lines and PR numbers.
      If the release was left with only the auto-generated commit/PR dump, or if the
      description is empty or missing, report as FAIL.
