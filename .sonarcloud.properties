# SonarCloud Automatic Analysis reads THIS file (.sonarcloud.properties).
# sonar-project.properties is for scanner-based analysis and is ignored here;
# sonar.autoscan.enabled is true for this project.

# The PreToolUse guards are deliberately standalone single-file scripts: the
# install recipe copies ONE of them into ~/.claude/hooks/ and wires that path in
# settings.json. A shared helper module would break every such single-file copy,
# so the payload-parsing block is identical in both by design — 13 lines each,
# which is enough to fail new_duplicated_lines_density on any PR that touches
# them. Excluded from duplication detection only; every other rule still applies.
sonar.cpd.exclusions=skills/*/scripts/guard-*.py
