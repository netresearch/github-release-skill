name: Script Tests

# Runs every shell self-test under skills/github-release/scripts/tests/. Thin
# caller of the shared script-check reusable, so the checkout pin and
# harden-runner are maintained centrally; the skill-repo-skill reusables
# validate skill *structure*, this checks script *behavior*.
#
# It used to name one test file. Four existed, so three of them had never gated
# anything — a suite that is not invoked is documentation. The loop fails on the
# first non-zero and prints which file it was.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  shell-tests:
    uses: netresearch/.github/.github/workflows/script-check.yml@main
    permissions:
      contents: read
    with:
      # The Python scripts start through uv (shebang and hooks.json), and the
      # runner image does not ship it: a pinned release, checked against the
      # sha256 file published with that release. Renovate bumps UV_VERSION
      # through the custom manager in renovate.json.
      pre-command: |
        # renovate: datasource=github-releases depName=astral-sh/uv
        UV_VERSION=0.13.6
        asset=uv-x86_64-unknown-linux-gnu.tar.gz
        base="https://github.com/astral-sh/uv/releases/download/$UV_VERSION"
        mkdir -p "$HOME/.local/bin"
        cd "$RUNNER_TEMP"
        curl -fsSL --proto '=https' -o "$asset" "$base/$asset"
        curl -fsSL --proto '=https' -o "$asset.sha256" "$base/$asset.sha256"
        sha256sum -c "$asset.sha256"
        tar -xzf "$asset" -C "$HOME/.local/bin" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      check-cmd: >-
        for t in skills/github-release/scripts/tests/*.test.sh; do
          echo "== $t"; bash "$t" || exit 1;
        done
