name: Script Tests

# Runs shell self-tests for scripts/ that ship one (currently the
# harvest-contributors PR-number extraction guard). Thin caller of the shared
# script-check reusable, so the checkout pin and harden-runner are maintained
# centrally; the skill-repo-skill reusables validate skill *structure*, this
# checks script *behavior*.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  shell-tests:
    uses: netresearch/.github/.github/workflows/script-check.yml@main
    permissions:
      contents: read
    with:
      check-cmd: bash skills/github-release/scripts/tests/harvest-contributors.test.sh
