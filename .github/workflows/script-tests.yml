name: Script Tests

# Runs every shell self-test under skills/github-release/scripts/tests/. Thin
# caller of the shared script-check reusable, so the checkout pin and
# harden-runner are maintained centrally; the skill-repo-skill reusables
# validate skill *structure*, this checks script *behavior*.
#
# It used to name one test file. Four existed, so three of them had never gated
# anything — a suite that is not invoked is documentation. The loop fails on the
# first non-zero and prints which file it was.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  shell-tests:
    uses: netresearch/.github/.github/workflows/script-check.yml@main
    permissions:
      contents: read
    with:
      # The Python scripts start through uv (shebang and hooks.json), and the
      # runner image does not ship it: a pinned release, checked by sha256.
      pre-command: |
        mkdir -p "$HOME/.local/bin"
        tgz="$RUNNER_TEMP/uv.tar.gz"
        curl -fsSL --proto '=https' -o "$tgz" "https://github.com/astral-sh/uv/releases/download/0.13.0/uv-x86_64-unknown-linux-gnu.tar.gz"
        echo "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154  $tgz" | sha256sum -c -
        tar -xzf "$tgz" -C "$HOME/.local/bin" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      check-cmd: >-
        for t in skills/github-release/scripts/tests/*.test.sh; do
          echo "== $t"; bash "$t" || exit 1;
        done
